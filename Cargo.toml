[package]
name = "xcore407i_blinker"
version = "0.7.0"
edition = "2024"

[build-dependencies]
cc = "1.11.3"
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
glob = "0.3"

[features]
default = []
cpu-cycle-diag = []
list-profile = []
nand-diagnostics = []

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4 = { version = "0.16.0", default-features = false, features = ["stm32f407", "rt"] }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f407"] }
panic-halt = "1.0.0"
libm = "0.2"
smoltcp = { version = "0.14.0", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-dhcpv4", "socket-tcp"] }

stm32f4-crc32 = { path = "crates/stm32f4-crc32" }
littlefs2 = { path = "vendor/littlefs2", default-features = false, features = ["c-stubs"] }
zmodem2 = { path = "vendor/zmodem2", default-features = false }

[profile.release]
codegen-units = 1
debug = 1
lto = true
opt-level = 3
panic = "abort"

[profile.dev]
debug = 2
opt-level = 1
panic = "abort"

[patch.crates-io]
littlefs2-sys = { path = "vendor/littlefs2-sys" }
