[package]
name = "xcore407i_blinker"
version = "0.1.0"
edition = "2024"

[build-dependencies]
cc = "1.11.1"
bindgen = "0.70.1"
glob = "0.3"

[features]
default = []
cpu-cycle-diag = []

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4 = { version = "0.16.0", default-features = false, features = ["stm32f407", "rt"] }
stm32f4xx-hal = { version = "0.23.0", default-features = false, features = ["stm32f407"] }
panic-halt = "1.0.0"
libm = "0.2"
littlefs2 = { version = "0.8.1", default-features = false, features = ["c-stubs"] }

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"
