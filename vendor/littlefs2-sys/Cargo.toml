[package]
name = "littlefs2-sys"
version = "0.4.0"
edition = "2018"
license = "BSD-3-Clause"
build = "build.rs"

[dependencies]
tinyrlibc = { version = "0.5", default-features = false, features = ["strchr", "strlen", "strcspn", "strspn"], optional = true }

[build-dependencies]
bindgen = { version = "0.70.1", default-features = false, features = ["runtime"] }
cc = "1"

[features]
assertions = []
trace = []
malloc = []
software-intrinsics = []
multiversion = []
tinyrlibc = ["dep:tinyrlibc"]
unstable-littlefs-patched = []
